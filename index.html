<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>글쓰기 타이머</title>

<style>
:root{
  --bg:#f5f7fb;
  --border:#e5e7eb;
  --muted:#6b7280;
}

*{ box-sizing:border-box; }

body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Noto Sans KR,sans-serif;
  background:var(--bg);
  padding:30px;
}

.wrapper{
  max-width:1200px;
  margin:auto;
  display:flex;
  flex-direction:column;
  gap:20px;
}

.top{
  display:grid;
  grid-template-columns:2fr 1fr;
  gap:20px;
}

.bottom{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
}

@media(max-width:900px){
  .top,.bottom{grid-template-columns:1fr;}
}

.card{
  background:white;
  border:1px solid var(--border);
  border-radius:16px;
  padding:20px;
}

textarea{
  width:100%;
  min-height:260px;
  padding:12px;
  border-radius:10px;
  border:1px solid var(--border);
  resize:vertical;
  font-size:12px;
  line-height:1.6;
}

.counter{
  margin-top:6px;
  font-size:12px;
  color:var(--muted);
}

#timerDisplay{
  font-size:48px;
  font-weight:700;
  margin:12px 0;
}

button{
  padding:6px 12px;
  border-radius:8px;
  border:none;
  background:#111;
  color:white;
  cursor:pointer;
  margin:4px;
}

button:hover{background:#333;}

.delete-btn{
  background:#dc7090;
}
.delete-btn:hover{
  background:#c85f7e;
}

input{
  padding:6px 8px;
  border-radius:8px;
  border:1px solid var(--border);
}

.save-item{
  display:flex;
  gap:6px;
  margin-bottom:6px;
  align-items:center;
}

.tab-btn{background:#ddd;color:black;}
.tab-btn.active{background:#111;color:white;}

.calc-display{
  width:100%;
  margin-bottom:6px;
}
</style>
</head>

<body>

<div class="wrapper">

  <div class="top">

    <div class="card">
      <h3>현재 작업</h3>
      <textarea id="mainText"></textarea>

      <div class="counter">
        공백 포함: <span id="mainAll">0</span> |
        공백 제외: <span id="mainNo">0</span>
      </div>

      <div style="margin-top:12px; display:flex; align-items:center;">
        <input type="text" id="docTitle" placeholder="문서 제목">
        <button id="saveDoc">저장</button>
        <button id="copyMain">복사하기</button>

        <div style="margin-left:auto;">
          <button id="clearMain" class="delete-btn">현재 작업 지우기</button>
        </div>
      </div>
    </div>

    <div class="card">
      <h3>타이머</h3>
      <input type="number" id="minuteInput" value="20" min="1">
      <div id="timerDisplay">20:00</div>
      <button id="start">시작</button>
      <button id="pause">일시정지</button>
      <button id="reset">리셋</button>

      <hr style="margin:20px 0;">

      <h3>계산기</h3>
      <input type="text" id="calcInput" class="calc-display" placeholder="예: 12+3*4">
      <button id="calcEq">=</button>
      <button id="calcClear">C</button>
      <div style="margin-top:6px;">결과: <strong id="calcResult">0</strong></div>
    </div>

  </div>

  <div class="bottom">

    <div class="card">
      <h2 style="margin-top:0;">저장소</h2>

      <div style="display:flex; align-items:center; margin-bottom:10px;">
        <button class="tab-btn active" id="docsTab">문서 목록</button>
        <button class="tab-btn" id="trashTab">휴지통</button>

        <button id="clearAllBtn" class="delete-btn" style="margin-left:auto;">
          전체 비우기
        </button>
      </div>

      <div id="docsSection"></div>
      <div id="trashSection" style="display:none;"></div>
    </div>

    <div class="card">
      <h3>불러온 문서</h3>
      <textarea id="secondText"></textarea>

      <div class="counter">
        공백 포함: <span id="secondAll">0</span> |
        공백 제외: <span id="secondNo">0</span>
      </div>

      <button id="overwriteBtn" disabled>덮어쓰기 저장</button>
      <button id="copySecond">복사하기</button>
    </div>

  </div>

</div>

<script>
const mainText=document.getElementById("mainText");
const secondText=document.getElementById("secondText");
const overwriteBtn=document.getElementById("overwriteBtn");
const docTitleInput=document.getElementById("docTitle");
const copyMain=document.getElementById("copyMain");
const copySecond=document.getElementById("copySecond");
const clearAllBtn=document.getElementById("clearAllBtn");

const docsTab=document.getElementById("docsTab");
const trashTab=document.getElementById("trashTab");
const docsSection=document.getElementById("docsSection");
const trashSection=document.getElementById("trashSection");

let currentIndex=null;

/* 글자수 */
function updateCount(area,a,b){
  const v=area.value;
  document.getElementById(a).textContent=Array.from(v).length;
  document.getElementById(b).textContent=Array.from(v.replace(/\s/g,"")).length;
}
mainText.addEventListener("input",()=>updateCount(mainText,"mainAll","mainNo"));
secondText.addEventListener("input",()=>updateCount(secondText,"secondAll","secondNo"));
updateCount(mainText,"mainAll","mainNo");
updateCount(secondText,"secondAll","secondNo");

/* 타이머 */
let timerSeconds=1200,interval=null,running=false;
function format(s){return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");}
function updateTime(){document.getElementById("timerDisplay").textContent=format(timerSeconds);}
document.getElementById("start").onclick=()=>{if(running)return;running=true;interval=setInterval(()=>{if(timerSeconds>0)timerSeconds--;updateTime();},1000);};
document.getElementById("pause").onclick=()=>{clearInterval(interval);running=false;};
document.getElementById("reset").onclick=()=>{clearInterval(interval);running=false;timerSeconds=(document.getElementById("minuteInput").value||1)*60;updateTime();};
updateTime();

/* 계산기 */
function calculate(){
  const input=document.getElementById("calcInput").value;
  try{
    const result=Function('"use strict";return ('+input+')')();
    document.getElementById("calcResult").textContent=result;
  }catch{
    document.getElementById("calcResult").textContent="오류";
  }
}
function clearCalc(){
  document.getElementById("calcInput").value="";
  document.getElementById("calcResult").textContent="0";
}
document.getElementById("calcEq").onclick=calculate;
document.getElementById("calcClear").onclick=clearCalc;

/* 저장소 */
function getDocs(){return JSON.parse(localStorage.getItem("docs")||"[]");}
function setDocs(d){localStorage.setItem("docs",JSON.stringify(d));}
function getTrash(){return JSON.parse(localStorage.getItem("trash")||"[]");}
function setTrash(t){localStorage.setItem("trash",JSON.stringify(t));}

function renderDocs(){
  docsSection.innerHTML="";
  getDocs().forEach((doc,i)=>{
    const div=document.createElement("div");
    div.className="save-item";

    const titleInput=document.createElement("input");
    titleInput.value=doc.title;
    titleInput.onchange=()=>{
      const docs=getDocs();
      docs[i].title=titleInput.value;
      setDocs(docs);
    };

    const open=document.createElement("button");
    open.textContent="열기";
    open.onclick=()=>{
      currentIndex=i;
      secondText.value=doc.content;
      overwriteBtn.disabled=false;
      updateCount(secondText,"secondAll","secondNo");
    };

    const del=document.createElement("button");
    del.textContent="삭제";
    del.className="delete-btn";
    del.onclick=()=>{
      const docs=getDocs();
      const removed=docs.splice(i,1)[0];
      setDocs(docs);
      const trash=getTrash();
      trash.push(removed);
      setTrash(trash);
      renderDocs();renderTrash();
    };

    div.append(titleInput,open,del);
    docsSection.appendChild(div);
  });
}

function renderTrash(){
  trashSection.innerHTML="";
  getTrash().forEach((doc,i)=>{
    const div=document.createElement("div");
    div.className="save-item";

    const title=document.createElement("span");
    title.textContent=doc.title;
    title.style.flex="1";

    const restore=document.createElement("button");
    restore.textContent="복구";
    restore.onclick=()=>{
      const docs=getDocs();
      docs.push(doc);
      setDocs(docs);
      const trash=getTrash();
      trash.splice(i,1);
      setTrash(trash);
      renderDocs();renderTrash();
    };

    const del=document.createElement("button");
    del.textContent="영구삭제";
    del.className="delete-btn";
    del.onclick=()=>{
      const trash=getTrash();
      trash.splice(i,1);
      setTrash(trash);
      renderTrash();
    };

    div.append(title,restore,del);
    trashSection.appendChild(div);
  });
}

document.getElementById("saveDoc").onclick=()=>{
  const docs=getDocs();
  docs.push({title:docTitleInput.value||"제목 없음",content:mainText.value});
  setDocs(docs);
  docTitleInput.value="";
  renderDocs();
};

document.getElementById("clearMain").onclick=()=>{
  mainText.value="";
  updateCount(mainText,"mainAll","mainNo");
};

overwriteBtn.onclick=()=>{
  if(currentIndex===null)return;
  const docs=getDocs();
  docs[currentIndex].content=secondText.value;
  setDocs(docs);
  renderDocs();
};

function updateClearBtn(){
  clearAllBtn.textContent=docsSection.style.display==="none"?"전체 영구삭제":"전체 비우기";
}

clearAllBtn.onclick=()=>{
  if(docsSection.style.display!=="none"){
    setTrash(getTrash().concat(getDocs()));
    setDocs([]);
    renderDocs();renderTrash();
  }else{
    setTrash([]);
    renderTrash();
  }
};

docsTab.onclick=()=>{
  docsSection.style.display="block";
  trashSection.style.display="none";
  docsTab.classList.add("active");
  trashTab.classList.remove("active");
  updateClearBtn();
};

trashTab.onclick=()=>{
  docsSection.style.display="none";
  trashSection.style.display="block";
  trashTab.classList.add("active");
  docsTab.classList.remove("active");
  updateClearBtn();
};

async function copyText(textarea){
  try{await navigator.clipboard.writeText(textarea.value);}
  catch{textarea.select();document.execCommand("copy");}
}
copyMain.onclick=()=>copyText(mainText);
copySecond.onclick=()=>copyText(secondText);

renderDocs();
renderTrash();
updateClearBtn();
</script>

</body>
</html>
