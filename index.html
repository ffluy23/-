<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Writing Widget</title>

<style>
html{
  background:transparent !important;
}

body{
  margin:0 !important;
  padding:0 !important;
  background:transparent !important;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Noto Sans KR,sans-serif;
}

/* 레이아웃 */
.wrapper{
  max-width:1100px;
  margin:0 auto !important;
  padding:10px;
  display:flex;
  flex-direction:column;
  gap:16px;
}

.top,.bottom{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
}

@media(max-width:900px){
  .top,.bottom{grid-template-columns:1fr;}
}

/* 카드 */
.card{
  background:white;
  border-radius:14px;
  padding:16px;
  box-shadow:0 4px 14px rgba(0,0,0,0.06);
}

/* 입력 */
textarea{
  width:100%;
  min-height:220px;
  padding:10px;
  border-radius:8px;
  border:1px solid #e5e7eb;
  resize:vertical;
  font-size:13px;
  line-height:1.6;
}

input{
  padding:6px 8px;
  border-radius:8px;
  border:1px solid #e5e7eb;
}

.counter{
  margin-top:6px;
  font-size:12px;
  color:#6b7280;
}

button{
  padding:6px 12px;
  border-radius:8px;
  border:none;
  background:#111;
  color:white;
  cursor:pointer;
  margin:4px;
  font-size:13px;
}

button:hover{background:#333;}

.delete-btn{
  background:#dc7090;
}
.delete-btn:hover{
  background:#c85f7e;
}

.save-item{
  display:flex;
  gap:6px;
  margin-bottom:6px;
  align-items:center;
}

.tab-btn{
  background:#ddd;
  color:black;
}
.tab-btn.active{
  background:#111;
  color:white;
}
</style>
</head>

<body>

<div class="wrapper">

  <div class="top">

    <div class="card">
      <h3>현재 작업</h3>
      <textarea id="mainText"></textarea>

      <div class="counter">
        공백 포함: <span id="mainAll">0</span> |
        공백 제외: <span id="mainNo">0</span>
      </div>

      <div style="margin-top:12px; display:flex; align-items:center;">
        <input type="text" id="docTitle" placeholder="문서 제목">
        <button id="saveDoc">저장</button>
        <div style="margin-left:auto;">
          <button id="clearMain" class="delete-btn">지우기</button>
        </div>
      </div>
    </div>

    <div class="card">
      <h3>타이머</h3>
      <input type="number" id="minuteInput" value="20" min="1">
      <div id="timerDisplay" style="font-size:42px;font-weight:700;margin:10px 0;">20:00</div>
      <button id="start">시작</button>
      <button id="pause">정지</button>
      <button id="reset">리셋</button>
    </div>

  </div>

  <div class="bottom">

    <div class="card">
      <h2 style="margin-top:0;">저장소</h2>

      <div style="display:flex; align-items:center; margin-bottom:10px;">
        <button class="tab-btn active" id="docsTab">문서</button>
        <button class="tab-btn" id="trashTab">휴지통</button>
        <button id="clearAllBtn" class="delete-btn" style="margin-left:auto;">
          전체 비우기
        </button>
      </div>

      <div id="docsSection"></div>
      <div id="trashSection" style="display:none;"></div>
    </div>

    <div class="card">
      <h3>불러온 문서</h3>
      <textarea id="secondText"></textarea>

      <div class="counter">
        공백 포함: <span id="secondAll">0</span> |
        공백 제외: <span id="secondNo">0</span>
      </div>

      <button id="overwriteBtn" disabled>덮어쓰기</button>
    </div>

  </div>

</div>

<script>
const mainText=document.getElementById("mainText");
const secondText=document.getElementById("secondText");
const overwriteBtn=document.getElementById("overwriteBtn");
const clearAllBtn=document.getElementById("clearAllBtn");
const docsTab=document.getElementById("docsTab");
const trashTab=document.getElementById("trashTab");
const docsSection=document.getElementById("docsSection");
const trashSection=document.getElementById("trashSection");

let currentIndex=null;
let timerSeconds=1200,interval=null,running=false;

/* 글자수 */
function updateCount(area,a,b){
  document.getElementById(a).textContent=area.value.length;
  document.getElementById(b).textContent=area.value.replace(/\s/g,"").length;
}
mainText.addEventListener("input",()=>updateCount(mainText,"mainAll","mainNo"));
secondText.addEventListener("input",()=>updateCount(secondText,"secondAll","secondNo"));

/* 타이머 */
function format(s){
  return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
}
function updateTime(){document.getElementById("timerDisplay").textContent=format(timerSeconds);}
document.getElementById("start").onclick=()=>{
  if(running)return;
  running=true;
  interval=setInterval(()=>{if(timerSeconds>0)timerSeconds--;updateTime();},1000);
};
document.getElementById("pause").onclick=()=>{clearInterval(interval);running=false;};
document.getElementById("reset").onclick=()=>{
  clearInterval(interval);running=false;
  timerSeconds=(document.getElementById("minuteInput").value||1)*60;
  updateTime();
};
updateTime();

/* 저장소 */
function getDocs(){return JSON.parse(localStorage.getItem("docs")||"[]");}
function setDocs(d){localStorage.setItem("docs",JSON.stringify(d));}
function getTrash(){return JSON.parse(localStorage.getItem("trash")||"[]");}
function setTrash(t){localStorage.setItem("trash",JSON.stringify(t));}

function renderDocs(){
  docsSection.innerHTML="";
  getDocs().forEach((doc,i)=>{
    const div=document.createElement("div");
    div.className="save-item";
    div.innerHTML=`<span style="flex:1">${doc.title}</span>`;
    const open=document.createElement("button");
    open.textContent="열기";
    open.onclick=()=>{currentIndex=i;secondText.value=doc.content;overwriteBtn.disabled=false;updateCount(secondText,"secondAll","secondNo");};
    const del=document.createElement("button");
    del.textContent="삭제";
    del.className="delete-btn";
    del.onclick=()=>{
      const docs=getDocs();
      const removed=docs.splice(i,1)[0];
      setDocs(docs);
      const trash=getTrash();
      trash.push(removed);
      setTrash(trash);
      renderDocs();renderTrash();
    };
    div.append(open,del);
    docsSection.appendChild(div);
  });
}

function renderTrash(){
  trashSection.innerHTML="";
  getTrash().forEach((doc,i)=>{
    const div=document.createElement("div");
    div.className="save-item";
    div.innerHTML=`<span style="flex:1">${doc.title}</span>`;
    const restore=document.createElement("button");
    restore.textContent="복구";
    restore.onclick=()=>{
      const docs=getDocs();
      docs.push(doc);
      setDocs(docs);
      const trash=getTrash();
      trash.splice(i,1);
      setTrash(trash);
      renderDocs();renderTrash();
    };
    const del=document.createElement("button");
    del.textContent="영구삭제";
    del.className="delete-btn";
    del.onclick=()=>{
      const trash=getTrash();
      trash.splice(i,1);
      setTrash(trash);
      renderTrash();
    };
    div.append(restore,del);
    trashSection.appendChild(div);
  });
}

document.getElementById("saveDoc").onclick=()=>{
  const docs=getDocs();
  docs.push({title:document.getElementById("docTitle").value||"제목 없음",content:mainText.value});
  setDocs(docs);
  renderDocs();
};

document.getElementById("clearMain").onclick=()=>{
  mainText.value="";
  updateCount(mainText,"mainAll","mainNo");
};

function updateClearBtn(){
  clearAllBtn.textContent=docsSection.style.display==="none"?"전체 영구삭제":"전체 비우기";
}

clearAllBtn.onclick=()=>{
  if(docsSection.style.display!=="none"){
    setTrash(getTrash().concat(getDocs()));
    setDocs([]);
    renderDocs();renderTrash();
  }else{
    setTrash([]);
    renderTrash();
  }
};

docsTab.onclick=()=>{
  docsSection.style.display="block";
  trashSection.style.display="none";
  docsTab.classList.add("active");
  trashTab.classList.remove("active");
  updateClearBtn();
};

trashTab.onclick=()=>{
  docsSection.style.display="none";
  trashSection.style.display="block";
  trashTab.classList.add("active");
  docsTab.classList.remove("active");
  updateClearBtn();
};

renderDocs();
renderTrash();
updateClearBtn();
</script>

</body>
</html>
